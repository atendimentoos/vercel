<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vidal Advocacia de Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#232620;
    --paper:#FAF7F0;
    --sage:#5C7A63;
    --sage-deep:#3C4F41;
    --gold:#A5813E;
    --line: rgba(35,38,32,0.16);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDE9DE; --paper:#1B1D18; --sage:#8FAE96; --sage-deep:#B7CBB9; --gold:#CBA45C; --line: rgba(237,233,222,0.18);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDE9DE; --paper:#1B1D18; --sage:#8FAE96; --sage-deep:#B7CBB9; --gold:#CBA45C; --line: rgba(237,233,222,0.18);
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior:smooth;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Work Sans', sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:500; margin:0; letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 28px;}
 
  header{
    position:sticky; top:0; padding-top: env(safe-area-inset-top, 0px);
    background:var(--paper); border-bottom:1px solid var(--line); z-index:10;
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:20px 0;}
  .brand{font-family:'Fraunces', serif; font-size:1.15rem;}
  .nav ul{list-style:none; display:flex; gap:32px; margin:0; padding:0; font-size:0.94rem;}
  .nav a{text-decoration:none; opacity:0.85;}
  .nav a:hover{opacity:1;}
  .nav .cta{border:1px solid var(--ink); padding:8px 16px; border-radius:2px;}
  .menu-btn{display:none; background:none; border:none; font:inherit; color:var(--ink); cursor:pointer;}
 
  .hero{padding:96px 0 88px; display:grid; grid-template-columns:1.3fr 1fr; gap:56px; align-items:end;}
  .hero h1{font-size:clamp(2.4rem, 5vw, 3.6rem); line-height:1.08; max-width:11ch;}
  .hero .lede{margin-top:24px; font-size:1.08rem; max-width:46ch; color:var(--ink); opacity:0.82;}
  .hero .actions{margin-top:32px; display:flex; gap:18px; align-items:center;}
  .btn{background:var(--sage-deep); color:var(--paper); text-decoration:none; padding:14px 26px; border-radius:2px; font-size:0.95rem;}
  .btn.ghost{background:none; color:var(--ink); border:1px solid var(--line); padding:13px 25px;}
  .hero-note{border-left:2px solid var(--gold); padding-left:20px; align-self:end;}
  .hero-note p{margin:0; font-size:0.92rem; opacity:0.85;}
  .hero-note .big{font-family:'Fraunces', serif; font-size:2.4rem; color:var(--sage-deep); display:block; margin-bottom:6px;}
 
  section{padding:72px 0; border-top:1px solid var(--line);}
  .section-head{display:flex; justify-content:space-between; align-items:baseline; gap:24px; margin-bottom:44px; flex-wrap:wrap;}
  .section-head h2{font-size:1.9rem; max-width:16ch;}
  .section-head p{max-width:38ch; font-size:0.96rem; opacity:0.78; margin:0;}
 
  .areas{display:grid; grid-template-columns:repeat(3,1fr); gap:0;}
  .area{padding:28px 26px; border-left:1px solid var(--line);}
  .area:first-child{border-left:none; padding-left:0;}
  .area h3{font-size:1.15rem; margin-bottom:10px;}
  .area p{margin:0; font-size:0.92rem; opacity:0.78;}
 
  .process{display:grid; gap:0;}
  .step{display:grid; grid-template-columns:64px 1fr; gap:20px; padding:22px 0; border-top:1px solid var(--line);}
  .process .step:first-child{border-top:none;}
  .step .n{font-family:'Fraunces', serif; font-size:1.3rem; color:var(--sage);}
  .step h3{font-size:1.08rem; margin-bottom:6px;}
  .step p{margin:0; font-size:0.92rem; opacity:0.78; max-width:56ch;}
 
  .about{display:grid; grid-template-columns:1fr 1.4fr; gap:48px; align-items:start;}
  .about .photo{aspect-ratio:3/4; background:linear-gradient(160deg, var(--sage-deep), var(--sage)); border-radius:2px;}
  .about h3{font-size:1.4rem; margin-bottom:14px;}
  .about p{font-size:0.98rem; opacity:0.85; max-width:52ch;}
  .about .cred{margin-top:20px; font-size:0.88rem; opacity:0.7; border-top:1px solid var(--line); padding-top:16px;}
 
  .contact{display:grid; grid-template-columns:1fr 1fr; gap:48px;}
  .contact h2{font-size:1.9rem; max-width:14ch;}
  .contact-list{list-style:none; margin:24px 0 0; padding:0; font-size:0.98rem;}
  .contact-list li{padding:12px 0; border-top:1px solid var(--line);}
  .contact-list li:first-child{border-top:none;}
  form{display:grid; gap:14px;}
  input, textarea{
    width:100%; padding:13px 14px; border:1px solid var(--line); background:transparent;
    color:var(--ink); font:inherit; border-radius:2px;
  }
  textarea{resize:vertical; min-height:100px;}
  form button{justify-self:start;}
 
  footer{border-top:1px solid var(--line); padding:28px 0; font-size:0.85rem; opacity:0.65; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
 
  @media (max-width: 860px){
    .nav ul{display:none;}
    .hero{grid-template-columns:1fr; gap:32px; padding:56px 0 48px;}
    .hero-note{border-left:none; border-top:2px solid var(--gold); padding-left:0; padding-top:16px;}
    .areas{grid-template-columns:1fr;}
    .area{border-left:none; border-top:1px solid var(--line); padding:24px 0;}
    .area:first-child{border-top:none;}
    .about{grid-template-columns:1fr;}
    .about .photo{aspect-ratio:16/9;}
    .contact{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
 
<header>
  <div class="wrap nav">
    <div class="brand">Vidal Advocacia</div>
    <ul>
      <li><a href="#atuacao">Áreas de atuação</a></li>
      <li><a href="#processo">Como funciona</a></li>
      <li><a href="#sobre">Sobre</a></li>
      <li><a href="#contato">Contato</a></li>
    </ul>
    <a class="cta" href="#contato">Falar com a advogada</a>
  </div>
</header>
 
<main>
  <section class="hero" style="border-top:none;">
    <div class="wrap" style="display:contents;">
      <div>
        <h1>Direito de família conduzido com cuidado, não só com processos.</h1>
        <p class="lede">Divórcio, guarda, pensão alimentícia, união estável e inventário — cada caso é uma família diferente. Cuidamos do lado jurídico para que você possa cuidar do resto.</p>
        <div class="actions">
          <a class="btn" href="#contato">Agendar conversa inicial</a>
          <a class="btn ghost" href="#atuacao">Ver áreas de atuação</a>
        </div>
      </div>
      <div class="hero-note">
        <span class="big">18 anos</span>
        <p>de atuação exclusiva em Direito de Família e Sucessões, com atendimento próximo e prazos claros em cada etapa.</p>
      </div>
    </div>
  </section>
 
  <section id="atuacao">
    <div class="wrap">
      <div class="section-head">
        <h2>Áreas de atuação</h2>
        <p>Cada processo de família tem urgências e sensibilidades próprias. Atuamos nestas frentes.</p>
      </div>
      <div class="areas">
        <div class="area">
          <h3>Divórcio e separação</h3>
          <p>Consensual ou litigioso, com foco em resolver rápido e proteger o que importa: filhos, bens e sua tranquilidade.</p>
        </div>
        <div class="area">
          <h3>Guarda e convivência</h3>
          <p>Definição de guarda, regime de visitas e mediação de conflitos, sempre priorizando o bem-estar da criança.</p>
        </div>
        <div class="area">
          <h3>Pensão alimentícia</h3>
          <p>Fixação, revisão ou execução de pensão, com cálculos claros e acompanhamento até o cumprimento.</p>
        </div>
        <div class="area">
          <h3>União estável</h3>
          <p>Reconhecimento, contratos de convivência e dissolução, com segurança jurídica para o casal.</p>
        </div>
        <div class="area">
          <h3>Inventário e sucessões</h3>
          <p>Partilha de bens judicial ou extrajudicial, planejamento sucessório e testamentos.</p>
        </div>
        <div class="area">
          <h3>Adoção</h3>
          <p>Orientação e acompanhamento completo do processo de habilitação e adoção.</p>
        </div>
      </div>
    </div>
  </section>
 
  <section id="processo">
    <div class="wrap">
      <div class="section-head">
        <h2>Como funciona o início do processo</h2>
        <p>Da primeira conversa até a definição da estratégia.</p>
      </div>
      <div class="process">
        <div class="step">
          <span class="n">01</span>
          <div><h3>Conversa inicial</h3><p>Você conta sua situação sem compromisso; entendemos o contexto familiar e as urgências envolvidas.</p></div>
        </div>
        <div class="step">
          <span class="n">02</span>
          <div><h3>Análise e estratégia</h3><p>Avaliamos documentos e cenários possíveis, e apresentamos um caminho claro, com prazos e custos estimados.</p></div>
        </div>
        <div class="step">
          <span class="n">03</span>
          <div><h3>Condução do caso</h3><p>Cuidamos de peticionamento, audiências e negociações, com atualizações regulares sobre o andamento.</p></div>
        </div>
        <div class="step">
          <span class="n">04</span>
          <div><h3>Resolução</h3><p>Buscamos o desfecho mais rápido e estável possível, seja por acordo ou decisão judicial.</p></div>
        </div>
      </div>
    </div>
  </section>
 
  <section id="sobre">
    <div class="wrap about">
      <div class="photo"></div>
      <div>
        <h3>Dra. Camila Vidal</h3>
        <p>Advogada especialista em Direito de Família e Sucessões, atua há 18 anos representando famílias em momentos de transição. Acredita que um bom processo jurídico começa com escuta e termina com clareza — não apenas com uma sentença.</p>
        <div class="cred">OAB/PA 000.000 · Pós-graduada em Direito de Família e Sucessões</div>
      </div>
    </div>
  </section>
 
  <section id="contato">
    <div class="wrap contact">
      <div>
        <h2>Vamos conversar sobre o seu caso</h2>
        <ul class="contact-list">
          <li>WhatsApp: (91) 90000-0000</li>
          <li>E-mail: contato@vidaladvocacia.com.br</li>
          <li>Atendimento: Belém e região, presencial ou online</li>
        </ul>
      </div>
      <form onsubmit="event.preventDefault(); this.querySelector('button').textContent='Mensagem enviada';">
        <input type="text" placeholder="Seu nome" required>
        <input type="text" placeholder="Telefone ou e-mail" required>
        <textarea placeholder="Conte brevemente sua situação"></textarea>
        <button class="btn" type="submit">Enviar mensagem</button>
      </form>
    </div>
  </section>
</main>
 
<footer class="wrap">
  <span>© 2026 Vidal Advocacia de Família e Sucessões</span>
  <span>Belém, PA</span>
</footer>
 
</body>
</html>
